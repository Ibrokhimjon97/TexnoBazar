[build]
base = "apps/superadmin"
command = "npm run build --workspace @texnobazar/superadmin"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
